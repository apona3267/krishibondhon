<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14532D" />
  <title>ইন্টারনেট সংযোগ নেই — কৃষিবন্ধন</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #0F3F22 0%, #14532D 55%, #15803D 100%);
      color: #0F172A;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .logo-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #15803D, #14532D, #0B331B);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(20, 83, 45, 0.35);
    }
    .badge {
      display: inline-block;
      background: #FEF3C7;
      color: #92400E;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
      border: 1px solid #FDE68A;
    }
    h1 {
      font-size: 22px;
      color: #14532D;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    p {
      font-size: 14px;
      color: #475569;
      line-height: 1.65;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      background: #15803D;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(21, 128, 61, 0.3);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover { background: #14532D; }
    .footer-note {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #F1F5F9;
      font-size: 12px;
      color: #64748B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="52" height="52">
        <circle cx="32" cy="13.5" r="5" fill="#F59E0B" />
        <path d="M32 6V4M38.5 13.5H40.5M36.8 8.7L38.2 7.3" stroke="#FDE68A" stroke-width="1.6" stroke-linecap="round" />
        <path d="M23 30C23 20 15 13 8.5 13.5C8.5 21.5 14 28.5 23 30Z" fill="#4ADE80" />
        <path d="M23 30C24 21 31 16 38.5 17C37.5 24 32 29 23 30Z" fill="#22C55E" />
        <path d="M23 30V21" stroke="#14532D" stroke-width="1.5" stroke-linecap="round" />
        <path d="M7.5 35C14 31.2 22.5 31 31 33.6C35 34.8 38 36.2 40.5 37.5" stroke="#FEF3C7" stroke-width="2.8" stroke-linecap="round" />
        <path d="M12 40.2C18.8 37.6 26.5 37.8 35.5 40.8" stroke="#86EFAC" stroke-width="2.4" stroke-linecap="round" />
      </svg>
    </div>
    <span class="badge">অফলাইন মোড</span>
    <h1>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h1>
    <p>কৃষিবন্ধনের লাইভ ফসল, বাজারদর ও পরিবহন তথ্য দেখতে আপনার ফোনের মোবাইল ডাটা অথবা Wi-Fi চালু করে নিচের বাটনে ট্যাপ করুন।</p>
    <button type="button" class="btn" onclick="window.location.reload()">
      ↻ পুনরায় চেষ্টা করুন
    </button>
    <div class="footer-note">কৃষিবন্ধন (KRISHIBONDHON) • কৃষিবন্ধনে, কৃষকের পাশে</div>
  </div>
  <script>
    window.addEventListener("online", function () {
      window.location.href = "./";
    });
  </script>
</body>
</html>
